name: Update contribution graph

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync with main
        run: git pull --rebase origin main
      - name: Generate graph
        run: node scripts/generate-contribution-graph.mjs
      - name: Generate profile stats
        run: node scripts/generate-profile-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish changes
        run: |
          if git diff --quiet -- assets/contribution-graph.svg assets/github-stats.svg; then
            echo "Profile activity assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg assets/github-stats.svg
          git commit -m "chore: refresh profile activity"
          git push origin main
