<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-labelledby="title desc">
  <title id="title">Development Activity</title>
  <desc id="desc">A blue interface heading for GitHub activity statistics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#061a32"/><stop offset="0.6" stop-color="#0a527d"/><stop offset="1" stop-color="#1596c8"/></linearGradient>
    <pattern id="lines" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M0 34L34 0" stroke="#80e4ff" stroke-width="1" opacity="0.12"/></pattern>
    <clipPath id="frame"><rect width="900" height="120" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="120" fill="url(#bg)"/>
    <rect width="900" height="120" fill="url(#lines)"/>
    <circle cx="822" cy="60" r="75" fill="none" stroke="#6adfff" stroke-width="2" opacity="0.4"/>
    <circle cx="822" cy="60" r="49" fill="none" stroke="#6adfff" stroke-width="2" stroke-dasharray="5 7" opacity="0.65"/>
    <circle cx="822" cy="60" r="17" fill="#63d9ff" opacity="0.9"/>
    <text x="42" y="45" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="4" fill="#5bd6ff">ACTIVITY LOG // LIVE DATA</text>
    <text x="42" y="84" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" fill="#ffffff">Building consistently, one commit at a time.</text>
  </g>
</svg>
