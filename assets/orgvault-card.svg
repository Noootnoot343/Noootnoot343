<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">OrgVault - Current Mission</title>
  <desc id="desc">OrgVault is an operational-readiness system currently in private active development.</desc>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#111111" opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#111111"/>
    </filter>
    <clipPath id="frame"><rect width="900" height="270" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="270" fill="#f7d51d"/>
    <rect width="900" height="270" fill="url(#dots)"/>
    <path d="M0 0H255L195 270H0Z" fill="#111111"/>
    <path d="M810 0H900V270H735Z" fill="#e53935"/>

    <g transform="rotate(-3 132 135)">
      <rect x="37" y="39" width="184" height="192" fill="#ffffff" filter="url(#shadow)"/>
      <rect x="50" y="52" width="158" height="166" fill="#111111"/>
      <path d="M83 102L129 76L175 102V158L129 184L83 158Z" fill="#f7d51d"/>
      <path d="M103 113H155V148H103Z" fill="#111111"/>
      <path d="M113 113V100H145V113" fill="none" stroke="#111111" stroke-width="8"/>
      <circle cx="129" cy="131" r="7" fill="#e53935"/>
      <text x="129" y="202" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">STATUS: PRIVATE</text>
    </g>

    <rect x="264" y="34" width="512" height="203" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="279" y="49" width="482" height="173" fill="#111111"/>
    <rect x="279" y="49" width="12" height="173" fill="#e53935"/>

    <text x="316" y="82" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#f7d51d">CURRENT MISSION // ACTIVE DEVELOPMENT</text>
    <text x="312" y="133" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#ffffff">ORGVAULT</text>
    <text x="316" y="163" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f7d51d">EVENT + LEADERSHIP-TURNOVER READINESS</text>
    <text x="316" y="194" font-family="Consolas, monospace" font-size="14" fill="#ffffff">SPRING BOOT / NEXT.JS / POSTGRESQL / FLYWAY</text>

    <g transform="rotate(-8 827 77)">
      <rect x="783" y="51" width="88" height="52" fill="#ffffff"/>
      <text x="827" y="73" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="900" fill="#111111">RELEASE</text>
      <text x="827" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#e53935">LOCKED</text>
    </g>
  </g>
</svg>
