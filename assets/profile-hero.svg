<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
  <title id="title">noots - Backend Developer in Training</title>
  <desc id="desc">A layered blue profile interface with circular motifs, glass panels, and cyan highlights.</desc>
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8edcff"/>
      <stop offset="0.48" stop-color="#2e9ed0"/>
      <stop offset="1" stop-color="#0a4f82"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3152"/>
      <stop offset="1" stop-color="#061a32"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5dd9ff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#5dd9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#56cfff" stroke-width="1" opacity="0.1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#001327" flood-opacity="0.55"/>
    </filter>
    <clipPath id="frame"><rect width="900" height="310" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="310" fill="url(#outer)"/>
    <circle cx="800" cy="30" r="250" fill="url(#glow)"/>
    <path d="M-20 260C170 177 287 338 478 251C652 172 774 214 940 91V340H-20Z" fill="#d9f5ff" opacity="0.16"/>
    <path d="M-10 281C180 198 289 348 482 268C660 194 778 232 930 123" fill="none" stroke="#d8f7ff" stroke-width="2" opacity="0.32"/>

    <rect x="28" y="28" width="844" height="254" rx="22" fill="url(#panel)" stroke="#8be3ff" stroke-width="2" filter="url(#shadow)"/>
    <rect x="28" y="28" width="844" height="254" rx="22" fill="url(#grid)"/>
    <path d="M610 28H872V282H730Z" fill="#0f6c9d" opacity="0.22"/>
    <path d="M680 28H872V196Z" fill="#58cfff" opacity="0.09"/>

    <g transform="translate(54 55)">
      <circle cx="92" cy="100" r="91" fill="#09233e" stroke="#62d6ff" stroke-width="3"/>
      <circle cx="92" cy="100" r="76" fill="none" stroke="#2d9fce" stroke-width="2" stroke-dasharray="7 8"/>
      <circle cx="92" cy="100" r="62" fill="#0d4369" stroke="#d9f7ff" stroke-width="5"/>
      <circle cx="92" cy="100" r="48" fill="#061a32"/>
      <text x="92" y="116" text-anchor="middle" font-family="Consolas, monospace" font-size="43" font-weight="800" fill="#7de1ff">&gt;_</text>
      <circle cx="151" cy="38" r="9" fill="#65ddff"/>
      <circle cx="32" cy="163" r="6" fill="#ffffff" opacity="0.8"/>
    </g>

    <g transform="translate(260 67)">
      <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="#64d8ff">SYSTEM PROFILE // ONLINE</text>
      <text x="0" y="88" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" letter-spacing="-3" fill="#ffffff">noots</text>
      <rect x="2" y="104" width="365" height="3" rx="2" fill="#30bdf1"/>
      <text x="0" y="139" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#c9f2ff">Backend Developer in Training</text>
      <text x="0" y="170" font-family="Consolas, monospace" font-size="15" fill="#70d8fb">code code code all day</text>
    </g>

