      <rect y="58" width="168" height="44" rx="12" fill="#092944" stroke="#41c8f5"/>
      <circle cx="22" cy="80" r="6" fill="#4bd8ff"/>
      <text x="38" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#ffffff">ACTIVE BUILD</text>
      <rect y="116" width="168" height="44" rx="12" fill="#092944" stroke="#41c8f5"/>
      <circle cx="22" cy="138" r="6" fill="#4bd8ff"/>
      <text x="34" y="143" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#ffffff">LEARNING BY BUILDING</text>
