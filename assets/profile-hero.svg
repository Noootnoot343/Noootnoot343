<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">noots - CS Student Learning Backend Development</title>
  <desc id="desc">A navy and cyan student profile banner with a pixelated Linux terminal.</desc>
  <defs>
