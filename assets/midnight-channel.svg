<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">noots - Backend Engineer in Training</title>
  <desc id="desc">A yellow, black, white, and red profile banner inspired by bold mystery-game interfaces.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#111111" opacity="0.2"/>
    </pattern>
    <pattern id="smallDots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.28"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="8" stdDeviation="0" flood-color="#111111" flood-opacity="1"/>
    </filter>
    <clipPath id="frame">
      <rect width="900" height="320" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="320" fill="#f7d51d"/>
    <rect width="900" height="320" fill="url(#dots)"/>

    <path d="M-40 0H335L210 320H-40Z" fill="#111111"/>
    <path d="M652 -30H940V95L728 145Z" fill="#111111"/>
    <path d="M570 320H940V205L690 238Z" fill="#111111"/>
    <path d="M750 -20L900 0V76L700 120Z" fill="url(#smallDots)"/>
    <path d="M650 260L900 205V320H610Z" fill="url(#smallDots)"/>

    <path d="M35 42L266 20L244 240L24 262Z" fill="#ffffff" filter="url(#shadow)"/>
    <path d="M47 53L251 34L232 225L37 245Z" fill="#e53935"/>
    <path d="M59 66L235 49L219 210L50 229Z" fill="#111111"/>
    <rect x="70" y="80" width="138" height="112" rx="7" fill="#f7d51d"/>
    <rect x="83" y="94" width="112" height="80" rx="4" fill="#111111"/>
    <text x="139" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="35" font-weight="900" fill="#ffffff">&gt;_</text>
    <path d="M99 192L85 214M179 192L193 214" stroke="#111111" stroke-width="8" stroke-linecap="round"/>

    <g transform="rotate(-2 530 145)">
      <rect x="285" y="63" width="472" height="176" fill="#ffffff" filter="url(#shadow)"/>
      <rect x="300" y="78" width="442" height="146" fill="#111111"/>
      <rect x="300" y="78" width="442" height="146" fill="url(#smallDots)" opacity="0.38"/>
      <rect x="300" y="78" width="14" height="146" fill="#e53935"/>
      <text x="337" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="4" fill="#f7d51d">MIDNIGHT CHANNEL // PROFILE</text>
      <text x="334" y="174" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-3" fill="#ffffff">NOOTS</text>
      <text x="337" y="205" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#f7d51d">BACKEND ENGINEER IN TRAINING</text>
    </g>

    <g transform="rotate(3 690 268)">
      <rect x="506" y="252" width="330" height="42" fill="#e53935"/>
      <text x="671" y="279" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#ffffff">CODE CODE CODE ALL DAY</text>
    </g>

    <circle cx="862" cy="163" r="32" fill="#e53935"/>
    <circle cx="862" cy="163" r="18" fill="#f7d51d"/>
    <circle cx="862" cy="163" r="7" fill="#111111"/>
  </g>
</svg>
