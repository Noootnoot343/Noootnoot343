<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Development Stack</title>
  <desc id="desc">A blue interface card grouping backend, data, frontend, and tooling technologies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b5f91"/><stop offset="1" stop-color="#061a32"/></linearGradient>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#70ddff" opacity="0.16"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001327" flood-opacity="0.55"/></filter>
    <clipPath id="frame"><rect width="900" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="#82cce9"/>
    <circle cx="80" cy="40" r="180" fill="#d9f6ff" opacity="0.2"/>
    <circle cx="860" cy="280" r="210" fill="#147cac" opacity="0.25"/>
    <rect x="24" y="24" width="852" height="252" rx="19" fill="url(#bg)" filter="url(#shadow)"/>
    <rect x="24" y="24" width="852" height="252" rx="19" fill="url(#dots)"/>
    <text x="52" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="#55d2ff">DEVELOPMENT LOADOUT</text>
    <text x="52" y="101" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Tools I currently use</text>
    <path d="M52 116H848" stroke="#2eb9ed" stroke-width="2"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <g transform="translate(52 140)">
        <rect width="185" height="104" rx="14" fill="#08263f" stroke="#36bfea"/>
        <text x="17" y="28" font-size="11" font-weight="800" letter-spacing="2" fill="#5ed9ff">BACKEND</text>
        <text x="17" y="58" font-size="18" font-weight="800" fill="#ffffff">Java 21</text>
        <text x="17" y="84" font-size="15" fill="#9fe8ff">Spring Boot</text>
      </g>
      <g transform="translate(255 140)">
        <rect width="185" height="104" rx="14" fill="#08263f" stroke="#36bfea"/>
        <text x="17" y="28" font-size="11" font-weight="800" letter-spacing="2" fill="#5ed9ff">DATA</text>
        <text x="17" y="58" font-size="18" font-weight="800" fill="#ffffff">PostgreSQL</text>
        <text x="17" y="84" font-size="15" fill="#9fe8ff">Flyway</text>
      </g>
      <g transform="translate(458 140)">
        <rect width="185" height="104" rx="14" fill="#08263f" stroke="#36bfea"/>
        <text x="17" y="28" font-size="11" font-weight="800" letter-spacing="2" fill="#5ed9ff">INTERFACE</text>
        <text x="17" y="58" font-size="18" font-weight="800" fill="#ffffff">Next.js</text>
        <text x="17" y="84" font-size="15" fill="#9fe8ff">TypeScript</text>
      </g>
      <g transform="translate(661 140)">
        <rect width="187" height="104" rx="14" fill="#08263f" stroke="#36bfea"/>
        <text x="17" y="28" font-size="11" font-weight="800" letter-spacing="2" fill="#5ed9ff">TOOLING</text>
        <text x="17" y="58" font-size="18" font-weight="800" fill="#ffffff">Docker + Git</text>
        <text x="17" y="84" font-size="15" fill="#9fe8ff">Python</text>
      </g>
    </g>
  </g>
</svg>
